<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            border-bottom: 1px solid #1a3a5c;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 20px rgba(0, 120, 255, 0.1);
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, #00d4ff 0%, #0066cc 60%, #003366 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 180, 255, 0.4);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 180, 255, 0.4); }
            50% { box-shadow: 0 0 30px rgba(0, 180, 255, 0.7); }
        }

        .logo svg { width: 24px; height: 24px; fill: white; }

        .header-text h1 {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(90deg, #00d4ff, #4da6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text p {
            font-size: 11px;
            color: #5a6a7a;
            margin-top: 2px;
        }

        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .voice-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #5a6a7a;
            cursor: pointer;
            user-select: none;
        }

        .voice-toggle input[type="checkbox"] {
            display: none;
        }

        .voice-toggle .toggle-track {
            width: 36px;
            height: 20px;
            background: #1e2d3d;
            border-radius: 10px;
            position: relative;
            transition: background 0.3s;
        }

        .voice-toggle input:checked + .toggle-track {
            background: #0066cc;
        }

        .voice-toggle .toggle-track::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #e0e0e0;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }

        .voice-toggle input:checked + .toggle-track::after {
            transform: translateX(16px);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #4da6ff;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00cc88;
            box-shadow: 0 0 8px #00cc88;
        }

        /* Chat area */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat::-webkit-scrollbar { width: 6px; }
        .chat::-webkit-scrollbar-track { background: transparent; }
        .chat::-webkit-scrollbar-thumb { background: #1a3a5c; border-radius: 3px; }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 14px;
            animation: slideIn 0.3s ease-out;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #0055aa, #0077cc);
            border-bottom-right-radius: 4px;
            color: #fff;
        }

        .message.bot {
            align-self: flex-start;
            background: #161b22;
            border: 1px solid #1e2d3d;
            border-bottom-left-radius: 4px;
        }

        .message.bot code, .message.bot pre {
            background: #0d1117;
            border-radius: 6px;
            padding: 2px 6px;
            font-family: 'Consolas', 'Fira Code', monospace;
            font-size: 13px;
        }

        .message.bot pre {
            padding: 10px 14px;
            overflow-x: auto;
            margin: 8px 0;
            border: 1px solid #1e2d3d;
        }

        .message strong {
            color: #4da6ff;
        }

        .message .voice-icon {
            display: inline-block;
            margin-right: 4px;
            font-size: 12px;
            opacity: 0.6;
        }

        .typing {
            align-self: flex-start;
            padding: 12px 20px;
            display: none;
            gap: 4px;
        }

        .typing.active { display: flex; }

        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4da6ff;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Voice visualization */
        .voice-overlay {
            display: none;
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 30, 60, 0.95);
            border: 1px solid #0088ff;
            border-radius: 20px;
            padding: 16px 28px;
            z-index: 100;
            align-items: center;
            gap: 14px;
            box-shadow: 0 0 30px rgba(0, 120, 255, 0.3);
            animation: slideIn 0.3s ease-out;
        }

        .voice-overlay.active { display: flex; }

        .voice-waves {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 30px;
        }

        .voice-waves .bar {
            width: 4px;
            background: #00d4ff;
            border-radius: 2px;
            animation: wave 0.8s ease-in-out infinite;
        }

        .voice-waves .bar:nth-child(1) { height: 10px; animation-delay: 0.0s; }
        .voice-waves .bar:nth-child(2) { height: 18px; animation-delay: 0.1s; }
        .voice-waves .bar:nth-child(3) { height: 26px; animation-delay: 0.2s; }
        .voice-waves .bar:nth-child(4) { height: 18px; animation-delay: 0.3s; }
        .voice-waves .bar:nth-child(5) { height: 10px; animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1.2); }
        }

        .voice-text {
            color: #4da6ff;
            font-size: 14px;
            min-width: 100px;
        }

        .voice-cancel {
            background: none;
            border: 1px solid #ff4444;
            color: #ff4444;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .voice-cancel:hover {
            background: #ff4444;
            color: white;
        }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 40px;
            color: #5a6a7a;
        }

        .welcome h2 {
            font-size: 28px;
            background: linear-gradient(90deg, #00d4ff, #4da6ff, #0088ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .welcome p { font-size: 14px; margin-bottom: 20px; }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .quick-btn {
            padding: 8px 16px;
            background: #161b22;
            border: 1px solid #1e2d3d;
            border-radius: 20px;
            color: #4da6ff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #1a2a3a;
            border-color: #4da6ff;
            transform: translateY(-1px);
        }

        /* Input area */
        .input-area {
            padding: 16px 24px;
            background: #0d1117;
            border-top: 1px solid #1a3a5c;
        }

        .input-wrap {
            display: flex;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        .input-wrap input {
            flex: 1;
            padding: 12px 18px;
            background: #161b22;
            border: 1px solid #1e2d3d;
            border-radius: 24px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrap input:focus {
            border-color: #4da6ff;
            box-shadow: 0 0 10px rgba(0, 120, 255, 0.15);
        }

        .input-wrap input::placeholder { color: #3a4a5a; }

        .mic-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #161b22;
            border: 2px solid #1e2d3d;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .mic-btn:hover {
            border-color: #4da6ff;
            background: #1a2a3a;
        }

        .mic-btn.listening {
            background: rgba(255, 50, 50, 0.15);
            border-color: #ff4444;
            animation: mic-pulse 1.5s ease-in-out infinite;
        }

        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 50, 50, 0.3); }
            50% { box-shadow: 0 0 0 10px rgba(255, 50, 50, 0); }
        }

        .mic-btn svg { width: 20px; height: 20px; fill: #5a6a7a; transition: fill 0.2s; }
        .mic-btn:hover svg { fill: #4da6ff; }
        .mic-btn.listening svg { fill: #ff4444; }

        .send-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0066cc, #0088ff);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 120, 255, 0.4);
        }

        .send-btn:active { transform: scale(0.95); }

        .send-btn svg { width: 20px; height: 20px; fill: white; }

        .footer-hint {
            text-align: center;
            font-size: 11px;
            color: #3a4a5a;
            margin-top: 8px;
        }

        /* Speaking indicator on logo */
        .logo.speaking {
            animation: speak-glow 0.6s ease-in-out infinite alternate;
        }

        @keyframes speak-glow {
            from { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); transform: scale(1); }
            to { box-shadow: 0 0 35px rgba(0, 255, 136, 0.8); transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo" id="logo">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <div class="header-text">
            <h1>J.A.R.V.I.S.</h1>
            <p>Just A Rather Very Intelligent System</p>
        </div>
        <div class="header-right">
            <label class="voice-toggle" title="Озвучивать ответы">
                <input type="checkbox" id="ttsToggle" checked>
                <div class="toggle-track"></div>
                <span>Голос</span>
            </label>
            <div class="status">
                <div class="status-dot"></div>
                Online
            </div>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="welcome">
            <h2>Привет, я Jarvis</h2>
            <p>Твой персональный ассистент для управления ПК. Говори или пиши!</p>
            <div class="quick-actions">
                <button class="quick-btn" onclick="sendQuick('системная информация')">💻 Система</button>
                <button class="quick-btn" onclick="sendQuick('процессы')">📋 Процессы</button>
                <button class="quick-btn" onclick="sendQuick('сеть')">🌐 Сеть</button>
                <button class="quick-btn" onclick="sendQuick('диски')">💾 Диски</button>
                <button class="quick-btn" onclick="sendQuick('время')">🕐 Время</button>
                <button class="quick-btn" onclick="sendQuick('файлы ~')">📂 Домашняя папка</button>
                <button class="quick-btn" onclick="sendQuick('помощь')">❓ Помощь</button>
            </div>
        </div>
        <div class="typing" id="typing">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Voice listening overlay -->
    <div class="voice-overlay" id="voiceOverlay">
        <div class="voice-waves">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="voice-text" id="voiceText">Слушаю...</div>
        <button class="voice-cancel" onclick="stopListening()" title="Отмена">✕</button>
    </div>

    <div class="input-area">
        <div class="input-wrap">
            <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Голосовой ввод (или нажми пробел для активации)">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
            <input type="text" id="input" placeholder="Напиши команду или нажми микрофон..."
                   autocomplete="off" autofocus>
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
        <div class="footer-hint">Enter — отправить • Микрофон — голосовая команда • Пробел — быстрый голосовой ввод</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        const socket = io();
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const typing = document.getElementById('typing');
        const micBtn = document.getElementById('micBtn');
        const voiceOverlay = document.getElementById('voiceOverlay');
        const voiceText = document.getElementById('voiceText');
        const ttsToggle = document.getElementById('ttsToggle');
        const logo = document.getElementById('logo');
        let welcomeVisible = true;

        // ---- Speech Recognition ----
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                voiceOverlay.classList.add('active');
                voiceText.textContent = 'Слушаю...';
            };

            recognition.onresult = (event) => {
                let interim = '';
                let final = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        final += transcript;
                    } else {
                        interim += transcript;
                    }
                }
                voiceText.textContent = final || interim || 'Слушаю...';
                if (final) {
                    stopListening();
                    input.value = final;
                    sendMessage(true);
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error === 'no-speech') {
                    voiceText.textContent = 'Не услышал. Попробуйте снова.';
                } else if (event.error === 'not-allowed') {
                    voiceText.textContent = 'Микрофон не разрешён. Разрешите в настройках.';
                }
                setTimeout(() => stopListening(), 1500);
            };

            recognition.onend = () => {
                if (isListening) {
                    stopListening();
                }
            };
        }

        function toggleVoice() {
            if (!recognition) {
                addMessage('⚠️ Голосовой ввод не поддерживается вашим браузером. Используйте Chrome.', 'bot');
                return;
            }
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        function startListening() {
            if (!recognition) return;
            try {
                window.speechSynthesis.cancel();
                recognition.start();
            } catch (e) {
                console.error('Cannot start recognition:', e);
            }
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            voiceOverlay.classList.remove('active');
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
        }

        // Spacebar shortcut for voice (when input not focused)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement !== input) {
                e.preventDefault();
                toggleVoice();
            }
        });

        // ---- Text-to-Speech ----
        function speak(text) {
            if (!ttsToggle.checked) return;
            if (!window.speechSynthesis) return;

            window.speechSynthesis.cancel();

            // Strip markdown and special characters for cleaner speech
            let clean = text
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`([^`]+)`/g, '$1')
                .replace(/[📋🖥️💾🌐🕐📂📄📁🚀⚡🤖❓🔍✅❌⚠️🛡️🔌🔋🗑️🚫🤔•]/g, '')
                .replace(/[-]{3,}/g, '')
                .replace(/\n{2,}/g, '. ')
                .replace(/\n/g, '. ')
                .trim();

            if (!clean || clean.length < 2) return;

            // Truncate long responses for speech
            if (clean.length > 500) {
                clean = clean.substring(0, 500) + '. Остальное смотрите на экране.';
            }

            const utterance = new SpeechSynthesisUtterance(clean);
            utterance.lang = 'ru-RU';
            utterance.rate = 1.1;
            utterance.pitch = 0.9;

            // Pick a Russian voice if available
            const voices = speechSynthesis.getVoices();
            const ruVoice = voices.find(v => v.lang.startsWith('ru'));
            if (ruVoice) utterance.voice = ruVoice;

            utterance.onstart = () => logo.classList.add('speaking');
            utterance.onend = () => logo.classList.remove('speaking');
            utterance.onerror = () => logo.classList.remove('speaking');

            speechSynthesis.speak(utterance);
        }

        // Preload voices
        if (window.speechSynthesis) {
            speechSynthesis.getVoices();
            speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        }

        // ---- Chat ----
        function formatMessage(text) {
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            return text;
        }

        function addMessage(text, type) {
            if (welcomeVisible) {
                const w = document.querySelector('.welcome');
                if (w) w.remove();
                welcomeVisible = false;
            }
            const div = document.createElement('div');
            div.className = 'message ' + type;
            div.innerHTML = type === 'bot' ? formatMessage(text) : text;
            chat.insertBefore(div, typing);
            chat.scrollTop = chat.scrollHeight;
        }

        let lastWasVoice = false;

        function sendMessage(fromVoice = false) {
            const text = input.value.trim();
            if (!text) return;
            lastWasVoice = fromVoice;
            const prefix = fromVoice ? '<span class="voice-icon">🎤</span> ' : '';
            addMessage(prefix + text, 'user');
            socket.emit('message', { text: text });
            input.value = '';
            input.focus();
        }

        function sendQuick(cmd) {
            input.value = cmd;
            sendMessage(false);
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage(false);
        });

        socket.on('typing', (data) => {
            typing.classList.toggle('active', data.status);
            chat.scrollTop = chat.scrollHeight;
        });

        socket.on('response', (data) => {
            addMessage(data.text, 'bot');
            speak(data.text);
        });

        socket.on('connect', () => {
            console.log('Connected to Jarvis');
        });

        socket.on('disconnect', () => {
            addMessage('⚠️ Потеряно соединение с Jarvis. Переподключение...', 'bot');
        });
    </script>
</body>
</html>
